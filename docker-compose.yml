services:
  postgres:
    image: postgres:16
    container_name: cloudpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudpulse
      POSTGRES_PASSWORD: cloudpulse
      POSTGRES_DB: cloudpulse
    ports:
      - "5432:5432"
    volumes:
      - cloudpulse_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudpulse -d cloudpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cloudpulse_pgdata:
